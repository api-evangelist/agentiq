aid: agentiq
name: AgentIQ
description: 'Agent IQ is an AI-powered relationship-banking and institutional-intelligence
  platform for banks and credit unions. Its Lynq platform connects account holders
  with a personal banker across persistent digital channels — messaging, SMS, voice,
  social (WhatsApp/Facebook), web chat, co-browsing and video banking — while its agentic-AI
  products (Smart Assist, Smart Drive, Smart Control) guide staff and automate back-office
  workflows. Delivered as SaaS with single-tenant deployment per institution and integrations
  into digital-banking cores (Q2, Narmi, Jack Henry Banno, ebankIT, FIS, Fiserv, Lumin,
  Apiture) via APIs and webhooks. SOC 2 Type II and WCAG 2.1 AA. Headquartered in Austin,
  Texas and backed by Sierra Ventures.'
